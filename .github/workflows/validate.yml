name: validate-and-package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skills against the Agent Skills spec
        run: |
          pip install pyyaml
          python3 scripts/validate.py .

      - name: Build Claude.ai upload ZIPs
        run: bash scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: skill-zips
          path: dist/*.zip

      - name: Attach ZIPs to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
